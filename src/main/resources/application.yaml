spring:
  application:
    name: appointment
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME:harshanarayanasetty}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # When Kafka is down, fail fast (seconds) instead of the 60s default, so the booking
        # request is never held up and the outbox publisher simply retries on its next poll.
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 6000
  outbox:
    topic: appointment.booked
    poll-interval-ms: 2000
clinic:
  time-zone: Asia/Kolkata